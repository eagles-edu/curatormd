<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">CuratorMD evidence to reviewed knowledge flow</title>
  <desc id="desc">Hermes captures an event, CuratorMD redacts and summarizes bounded evidence, creates a proposal, waits for human review, then writes approved knowledge and separate learning observations. Later QA outcomes remain a separate evidence stream.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#172033}.head{font-size:18px;font-weight:700}.copy{font-size:14px}.small{font-size:12px;fill:#475569}.box{rx:14;stroke-width:2}
    </style>
  </defs>
  <rect width="1120" height="430" fill="#f8fafc" rx="18"/>
  <text x="40" y="42" class="head">CuratorMD keeps four kinds of information separate</text>
  <g transform="translate(30 90)">
    <rect class="box" width="185" height="132" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="18" y="30" class="head">1 · Event evidence</text>
    <text x="18" y="58" class="copy"><tspan x="18">Hermes lifecycle facts</tspan><tspan x="18" dy="21">result, tests, changes</tspan><tspan x="18" dy="21">raw response is removed</tspan></text>
  </g>
  <g transform="translate(250 90)">
    <rect class="box" width="195" height="132" fill="#ecfccb" stroke="#65a30d"/>
    <text x="18" y="30" class="head">2 · Safe proposal</text>
    <text x="18" y="58" class="copy"><tspan x="18">bounded summary</tspan><tspan x="18" dy="21">candidate + predictions</tspan><tspan x="18" dy="21">never writes while pending</tspan></text>
  </g>
  <g transform="translate(480 90)">
    <rect class="box" width="190" height="132" fill="#fef3c7" stroke="#d97706"/>
    <text x="18" y="30" class="head">3 · Human decision</text>
    <text x="18" y="58" class="copy"><tspan x="18">approve or do-not-record</tspan><tspan x="18" dy="21">priority 0–5</tspan><tspan x="18" dy="21">archive + optional edits</tspan></text>
  </g>
  <g transform="translate(705 90)">
    <rect class="box" width="180" height="132" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="18" y="30" class="head">4 · Two results</text>
    <text x="18" y="58" class="copy"><tspan x="18">approved: archive append</tspan><tspan x="18" dy="21">all decisions: label record</tspan><tspan x="18" dy="21">journal makes retries safe</tspan></text>
  </g>
  <g transform="translate(920 90)">
    <rect class="box" width="170" height="132" fill="#dcfce7" stroke="#16a34a"/>
    <text x="18" y="30" class="head">5 · Later evidence</text>
    <text x="18" y="58" class="copy"><tspan x="18">QA outcomes</tspan><tspan x="18" dy="21">retrospective utility</tspan><tspan x="18" dy="21">never rewrite labels</tspan></text>
  </g>
  <path d="M216 156H244M446 156H474M671 156H699M886 156H914" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M575 230V284H795" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540" y="296" width="475" height="78" rx="12" fill="#fff" stroke="#94a3b8"/>
  <text x="560" y="324" class="head">Statistical learning</text>
  <text x="560" y="348" class="copy">Learns from finalized human labels; reports prospective prediction errors.</text>
  <text x="560" y="366" class="small">It does not learn from pending proposals or its own automatic decisions.</text>
  <text x="40" y="325" class="small">Safety boundary</text>
  <text x="40" y="350" class="copy">No silent approval</text>
  <text x="40" y="373" class="copy">No cross-repo training</text>
</svg>
