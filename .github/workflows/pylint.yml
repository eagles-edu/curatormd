name: CuratorMD checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pylint pyright
      - name: Run CuratorMD tests
        run: python -m unittest discover -s plugins/curatormd/tests -v
      - name: Check Python types with Pyright
        run: python -m pyright --project .
      - name: Analyse the code with Pylint
        run: python -m pylint --errors-only $(git ls-files '*.py')
